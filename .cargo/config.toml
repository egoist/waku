[env]
# Xcode ships the Metal compiler as an optional toolchain. GPUI's build script
# invokes `xcrun metal`, so select that toolchain for precompiled shaders.
TOOLCHAINS = "Metal"
# JSON has no bigint literal, so generated browser bindings model the wire's
# integer fields as JavaScript numbers.
TS_RS_LARGE_INT = "number"

# Link the C runtime statically on Windows, as Zed does for GPUI. The
# alternative is shipping (or installing) the Visual C++ redistributable, and
# neither works here: Waku installs per-user with no elevation precisely so it
# can update itself silently, and the portable zip has to run from wherever it
# is unpacked. Windows on Arm makes the failure routine rather than rare — an
# arm64 machine almost never has the arm64 redistributable already, so a
# dynamically linked build dies at startup on `VCRUNTIME140.dll`.
[target.'cfg(target_os = "windows")']
rustflags = ["-C", "target-feature=+crt-static"]

# The MSVC linker still applies the Cortex-A53 erratum 843419 workaround on
# arm64, and it fails hard (LNK1322) when it cannot rewrite a flagged sequence
# — which is what a `codegen-units = 1` release build hands it, one object per
# crate with no room to move code around. Nothing that runs Windows on Arm has
# a Cortex-A53, so the check guards against a CPU this binary never meets. The
# undocumented `-arm64hazardfree` flag turns it off; rustc itself shipped it
# for the same reason in 1.88 (rust-lang/rust#140758) and dropped it again in
# #141045 only because the compiler should not depend on an undocumented
# option. Spell it with a dash, not a slash, so `lld-link` also parses it.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-arm64hazardfree"]

[build]
jobs = 4

[profile.dev]
debug = "line-tables-only"