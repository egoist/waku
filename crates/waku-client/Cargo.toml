[package]
name = "waku-client"
version = "0.1.0"
edition = "2024"
description = "Rust client and daemon process supervisor for Waku"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
dirs = "6.0"
parking_lot = "0.12"
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
