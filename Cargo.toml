[package]
name = "waku"
version = "0.0.11"
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "GPL-3.0-only"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["test-support"] }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["font-kit"] }
parking_lot = "0.12"
rquickjs = "0.12.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
pulldown-cmark = "0.13"
regex = "1"
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
wry = { version = "0.56", features = ["devtools"] }
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
