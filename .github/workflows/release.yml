name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from Cargo.toml
        id: resolve
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          # Cargo.toml is the source of truth. A tag push must agree with it;
          # a manual run has no tag and simply releases what Cargo.toml says.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as v$version"

  linux-x86_64:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-22.04-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-22.04-rust-1.96.0-release-

      - name: Bundle
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: target/release/waku-*-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: Linux arm64
    needs: version
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-22.04-arm-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ubuntu-22.04-arm-rust-1.96.0-release-

      - name: Bundle
        run: ./scripts/bundle-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: target/release/waku-*-aarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - uses: oven-sh/setup-bun@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-latest-rust-1.96.0-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-latest-rust-1.96.0-release-

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Store notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials NOTARY \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Release
        env:
          WAKU_SIGNING_IDENTITY: ${{ secrets.WAKU_SIGNING_IDENTITY }}
          WAKU_ANALYTICS_ENDPOINT: ${{ secrets.WAKU_ANALYTICS_ENDPOINT }}
          WAKU_ANALYTICS_WEBSITE_ID: ${{ secrets.WAKU_ANALYTICS_WEBSITE_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bun run release --local

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/Waku-*.dmg
            dist/Waku-*.md
            dist/Waku-*.zip
            dist/appcast.xml
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [version, linux-x86_64, linux-arm64, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the Linux version pointer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "$VERSION" > artifacts/latest-linux.txt

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
            import { extractReleaseNotes } from "./scripts/changelog.ts";
            const version = process.env.VERSION;
            const file = Bun.file("CHANGELOG.md");
            const notes = (await file.exists())
              ? extractReleaseNotes(await file.text(), version)
              : null;
            await Bun.write(
              "release-notes.md",
              `${notes ?? "See CHANGELOG.md for details."}\n`,
            );
          '

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A manual run has no tag yet; publishing the draft creates this one
          # at the commit that was built.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.md
            artifacts/*.zip
            artifacts/appcast.xml
            artifacts/latest-linux.txt
